<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>تپ کوین</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#161c3a;
    --bg-bottom:#0a0d1c;
    --surface:#1b2140;
    --surface-2:#232a52;
    --border:rgba(255,255,255,0.08);
    --text:#f5f3ec;
    --muted:#9098b8;
    --gold:#f2b705;
    --gold-deep:#b9720a;
    --energy:#6fcf97;
    --energy-low:#e26a5a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Manrope',sans-serif;
    background:radial-gradient(120% 100% at 50% -10%, var(--bg-top), var(--bg-bottom) 70%);
    color:var(--text);
    overflow:hidden;
    user-select:none;
  }
  .screen{
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    max-width:480px;
    margin:0 auto;
  }

  /* --- top bar --- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .profile{display:flex;align-items:center;gap:10px;}
  .avatar{
    width:38px;height:38px;border-radius:50%;
    background:linear-gradient(145deg,var(--gold),var(--gold-deep));
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#1b1200;font-size:16px;flex-shrink:0;
  }
  .profile .name{font-weight:700;font-size:14px;line-height:1.2;}
  .profile .name span{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:1px;}
  .level-badge{
    background:var(--surface);border:1px solid var(--border);
    padding:6px 14px;border-radius:100px;font-size:13px;font-weight:700;
    font-family:'Space Grotesk',sans-serif;color:var(--gold);
    white-space:nowrap;
  }

  /* --- balance --- */
  .balance-area{text-align:center;margin-top:14px;}
  .balance-label{color:var(--muted);font-size:13px;font-weight:500;}
  .balance{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:44px;letter-spacing:-0.5px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin-top:2px;
    font-variant-numeric:tabular-nums;
  }
  .balance svg{width:30px;height:30px;flex-shrink:0;}

  .mini-stats{display:flex;justify-content:center;gap:22px;margin-top:10px;color:var(--muted);font-size:13px;}
  .mini-stats b{color:var(--text);font-family:'Space Grotesk',sans-serif;}

  /* --- coin tap area --- */
  .coin-area{
    flex:1;display:flex;align-items:center;justify-content:center;position:relative;
  }
  .coin-btn{
    width:min(58vw,260px);height:min(58vw,260px);
    border-radius:50%;border:none;cursor:pointer;position:relative;
    background:radial-gradient(circle at 35% 30%, #ffe9a8, var(--gold) 45%, var(--gold-deep) 100%);
    box-shadow:0 0 0 10px rgba(242,183,5,0.06), 0 20px 40px -12px rgba(242,183,5,0.35), inset 0 -10px 20px rgba(0,0,0,0.25), inset 0 8px 16px rgba(255,255,255,0.35);
    transition:transform .08s ease;
    display:flex;align-items:center;justify-content:center;
  }
  .coin-btn:active{transform:scale(0.94);}
  .coin-btn svg{width:46%;height:46%;opacity:0.9;}
  .coin-glow{
    position:absolute;inset:0;border-radius:50%;pointer-events:none;
  }

  .float-plus{
    position:absolute;pointer-events:none;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;color:var(--gold);
    animation:floatUp 900ms ease-out forwards;
    text-shadow:0 2px 8px rgba(0,0,0,0.4);
  }
  @keyframes floatUp{
    0%{transform:translateY(0) scale(0.8);opacity:0;}
    15%{opacity:1;transform:translateY(-10px) scale(1);}
    100%{transform:translateY(-90px) scale(1.05);opacity:0;}
  }

  /* --- energy bar --- */
  .energy-wrap{margin-top:auto;}
  .energy-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .energy-row b{color:var(--text);font-family:'Space Grotesk',sans-serif;}
  .energy-track{height:12px;border-radius:100px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border);}
  .energy-fill{height:100%;background:linear-gradient(90deg,var(--energy),#4fb37c);border-radius:100px;transition:width .25s ease;}
  .energy-fill.low{background:linear-gradient(90deg,var(--energy-low),#c94a3a);}

  .banner{
    position:absolute;top:10px;left:14px;right:14px;
    background:var(--surface);border:1px solid var(--border);
    padding:10px 14px;border-radius:12px;font-size:12.5px;color:var(--muted);
    text-align:center;z-index:20;
  }
</style>
</head>
<body>

<div class="screen">
  <div id="banner" class="banner" style="display:none;"></div>

  <div class="topbar">
    <div class="profile">
      <div class="avatar" id="avatar">?</div>
      <div class="name" id="username">در حال اتصال...<span id="rankLabel"></span></div>
    </div>
    <div class="level-badge">لول <span id="levelNum">1</span></div>
  </div>

  <div class="balance-area">
    <div class="balance-label">موجودی</div>
    <div class="balance">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#F2B705" stroke="#B9720A" stroke-width="1.5"/><text x="12" y="16.5" font-size="11" font-weight="700" text-anchor="middle" fill="#7a4c05">$</text></svg>
      <span id="coinCount">0</span>
    </div>
    <div class="mini-stats">
      <div>هر تپ: <b id="perTap">1</b></div>
    </div>
  </div>

  <div class="coin-area">
    <div class="coin-glow" id="coinGlow"></div>
    <button class="coin-btn" id="coinBtn" aria-label="تپ برای گرفتن سکه">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#7a4c05" opacity="0.15"/><path d="M12 6v12M9 8.5c0-1.4 1.3-2.5 3-2.5s3 1.1 3 2.2c0 2.8-6 1.6-6 4.7 0 1.3 1.3 2.3 3 2.3s3-1 3-2.4" stroke="#7a4c05" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
    </button>
  </div>

  <div class="energy-wrap">
    <div class="energy-row">
      <span>⚡ انرژی</span>
      <span><b id="energyNum">0</b> / <span id="energyMax">0</span></span>
    </div>
    <div class="energy-track"><div class="energy-fill" id="energyFill" style="width:0%"></div></div>
  </div>
</div>

<script>
// ====================== تنظیمات ======================
// آدرس بک‌اندت رو اینجا بذار (همون آدرسی که از Render/Railway می‌گیری)
const API_BASE = "https://rrrrrrrrrrrrrr-zl4e.onrender.com";
// =======================================================

const tg = window.Telegram && window.Telegram.WebApp;
let state = { coins: 0, level: 1, energy: 1000, maxEnergy: 1000, coinsPerTap: 1 };
let pendingTaps = 0;
let syncing = false;
let initDataStr = null;

const el = {
  banner: document.getElementById('banner'),
  avatar: document.getElementById('avatar'),
  username: document.getElementById('username'),
  levelNum: document.getElementById('levelNum'),
  coinCount: document.getElementById('coinCount'),
  perTap: document.getElementById('perTap'),
  energyNum: document.getElementById('energyNum'),
  energyMax: document.getElementById('energyMax'),
  energyFill: document.getElementById('energyFill'),
  coinBtn: document.getElementById('coinBtn'),
};

function fmt(n){ return Math.floor(n).toLocaleString('en-US'); }

function render(){
  el.coinCount.textContent = fmt(state.coins);
  el.levelNum.textContent = state.level;
  el.perTap.textContent = state.coinsPerTap;
  el.energyNum.textContent = fmt(state.energy);
  el.energyMax.textContent = fmt(state.maxEnergy);
  const pct = Math.max(0, Math.min(100, (state.energy / state.maxEnergy) * 100));
  el.energyFill.style.width = pct + '%';
  el.energyFill.classList.toggle('low', pct < 20);
}

function showBanner(msg){
  el.banner.textContent = msg;
  el.banner.style.display = 'block';
}

function spawnFloatText(x, y){
  const t = document.createElement('div');
  t.className = 'float-plus';
  t.textContent = '+' + state.coinsPerTap;
  t.style.left = (x - 12) + 'px';
  t.style.top = (y - 20) + 'px';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 950);
}

function tap(clientX, clientY){
  if (state.energy < 1) {
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    return;
  }
  state.energy -= 1;
  state.coins += state.coinsPerTap;
  pendingTaps += 1;
  render();
  spawnFloatText(clientX, clientY);
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  el.coinBtn.style.transform = 'scale(0.94)';
  requestAnimationFrame(() => setTimeout(() => { el.coinBtn.style.transform = ''; }, 90));
}

el.coinBtn.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const touches = e.touches ? e.touches : [e];
  tap(e.clientX, e.clientY);
});

async function syncLoop(){
  if (pendingTaps > 0 && !syncing && initDataStr) {
    const taps = pendingTaps;
    pendingTaps = 0;
    syncing = true;
    try {
      const res = await fetch(API_BASE + '/api/tap', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData: initDataStr, taps }),
      });
      if (res.ok) {
        const data = await res.json();
        state = { ...state, ...data };
        render();
      }
    } catch (e) {
      // اگه اینترنت قطع بود، تپ‌های ازدست‌رفته رو برگردون تا بار بعد دوباره تلاش کنه
      pendingTaps += taps;
    } finally {
      syncing = false;
    }
  }
  setTimeout(syncLoop, 1500);
}

async function init(){
  if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor && tg.setHeaderColor('#0a0d1c');
    tg.setBackgroundColor && tg.setBackgroundColor('#0a0d1c');
  }

  if (tg && tg.initData) {
    initDataStr = tg.initData;
    const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (u) {
      el.avatar.textContent = (u.first_name || '?').charAt(0).toUpperCase();
      el.username.innerHTML = (u.first_name || 'بازیکن') + (u.username ? '<span>@' + u.username + '</span>' : '');
    }
  } else {
    // حالت تست خارج از تلگرام - فقط برای پیش‌نمایش، سکه‌ها سیو نمیشه
    showBanner('برای ذخیره‌ی سکه‌ها باید این بازی رو از داخل ربات تلگرام باز کنی');
    el.avatar.textContent = 'T';
    el.username.textContent = 'حالت تست';
    let devId = localStorage.getItem('devId');
    if (!devId) { devId = Math.floor(Math.random()*100000); localStorage.setItem('devId', devId); }
    initDataStr = 'dev:' + devId + ':تست';
  }

  try {
    const res = await fetch(API_BASE + '/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: initDataStr }),
    });
    if (res.ok) {
      state = await res.json();
      if (state.firstName) {
        el.avatar.textContent = state.firstName.charAt(0).toUpperCase();
        el.username.innerHTML = state.firstName + (state.username ? '<span>@' + state.username + '</span>' : '');
      }
    } else {
      showBanner('اتصال به سرور برقرار نشد، دوباره امتحان کن');
    }
  } catch (e) {
    showBanner('اتصال به سرور برقرار نشد. آدرس بک‌اند رو چک کن');
  }

  render();
  syncLoop();
}

init();
</script>
</body>
</html>
